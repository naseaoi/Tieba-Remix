name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid SemVer tag: $TAG" >&2
            exit 1
          fi
          git cat-file -e "$TAG^{tag}" 2>/dev/null || {
            echo "Release tag must be annotated: $TAG" >&2
            exit 1
          }
          TARGET_BRANCH="main"
          if [[ "$TAG" == *-* ]]; then
            TARGET_BRANCH="preview"
          fi
          git fetch origin "$TARGET_BRANCH" --no-tags
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$TAG_COMMIT" "origin/$TARGET_BRANCH" || {
            echo "$TAG does not point to a commit on $TARGET_BRANCH" >&2
            exit 1
          }

      - name: Lint source
        run: pnpm lint

      - name: Lint styles
        run: pnpm lint:styles

      - name: Test
        run: pnpm test

      - name: Build with tag-injected version
        env:
          USERSCRIPT_VERSION: ${{ github.ref_name }}
        run: pnpm build

      - name: Decide release channel from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 带 - 后缀的 SemVer prerelease 走 preview 通道
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "target=preview" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "target=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Read annotated tag notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if git cat-file -e "$TAG^{tag}" 2>/dev/null; then
            git tag -l "$TAG" --format='%(contents:body)' > release-notes.md
          else
            : > release-notes.md
          fi

          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ steps.meta.outputs.target }}
          PRERELEASE_FLAG: ${{ steps.meta.outputs.prerelease == 'true' && '--prerelease' || '' }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        run: |
          if [ "$HAS_NOTES" = "true" ]; then
            NOTES_ARGS=(--notes-file release-notes.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi

          # release 已存在则补充 asset
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$HAS_NOTES" = "true" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
            gh release upload "$TAG" build/tieba-remix.user.js --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$TARGET" \
              "${NOTES_ARGS[@]}" \
              $PRERELEASE_FLAG \
              build/tieba-remix.user.js
          fi
